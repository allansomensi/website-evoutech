<?xml version="1.0" encoding="utf-8"?>
<!-- Logo animado Evoutech: mordaça rotativa de embaladora flow-pack. Fundo transparente; feito para fundo escuro. -->
<svg viewBox="0 0 720 340" role="img" aria-label="Símbolo da Evoutech animado como a mordaça rotativa de uma embaladora: produtos entram na esteira, recebem o filme e saem selados." class="ml" xmlns="http://www.w3.org/2000/svg"><style>.ml {
  --ml-t: 1.8s;
  overflow: visible;
}
.ml-move {
  animation: ml-move var(--ml-t) linear infinite;
}
.ml-jaw {
  transform-box: fill-box;
  transform-origin: center;
  animation: ml-jaw var(--ml-t) linear infinite;
}
.ml-roller {
  transform-box: fill-box;
  transform-origin: center;
  animation: ml-spin var(--ml-t) linear infinite;
  fill: none;
  stroke: rgb(255 255 255 / 0.45);
  stroke-width: 1.5;
}
.ml-reel {
  transform-box: fill-box;
  transform-origin: center;
  animation: ml-unwind var(--ml-t) linear infinite;
}
.ml-seal {
  stroke: #fff;
  stroke-width: 2.5;
  stroke-linecap: round;
  opacity: 0;
  animation: ml-seal var(--ml-t) ease-out infinite;
}
.ml[data-paused] *,
.ml[data-paused] {
  animation-play-state: paused;
}
@media (prefers-reduced-motion: reduce) {
  .ml * {
    animation: none !important;
  }
}
.ml-logo {
  fill: #fff;
}
.ml-frame {
  fill: none;
  stroke: rgb(255 255 255 / 0.16);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ml-belt {
  fill: rgb(255 255 255 / 0.04);
  stroke: rgb(255 255 255 / 0.3);
  stroke-width: 1.5;
}
.ml-tick {
  stroke: rgb(255 255 255 / 0.16);
  stroke-width: 1.5;
}
.ml-product {
  fill: #d8a15a;
}
.ml-product-dot {
  fill: #a8742f;
}
.ml-film {
  fill: #2357e6;
  fill-opacity: 0.6;
}
.ml-film-shine,
.ml-crimp-line {
  stroke: rgb(255 255 255 / 0.4);
  stroke-width: 1.25;
  stroke-linecap: round;
  fill: none;
}
.ml-crimp {
  fill: #6b93ff;
  fill-opacity: 0.75;
}
.ml-label {
  fill: #fff;
  fill-opacity: 0.9;
}
.ml-web {
  fill: none;
  stroke: #6b93ff;
  stroke-opacity: 0.6;
  stroke-width: 1.5;
}
.ml-reel-roll {
  fill: #2357e6;
  fill-opacity: 0.35;
  stroke: #6b93ff;
  stroke-opacity: 0.7;
  stroke-width: 1.5;
}
.ml-reel-core {
  fill: #0b0f14;
  stroke: rgb(255 255 255 / 0.5);
  stroke-width: 1.5;
}
.ml-reel-spoke {
  stroke: rgb(255 255 255 / 0.5);
  stroke-width: 1.5;
  stroke-linecap: round;
}
.ml-callout {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  fill: rgb(255 255 255 / 0.5);
}
.ml-callout-n {
  fill: #6b93ff;
}
.ml-leader {
  fill: none;
  stroke: rgb(255 255 255 / 0.25);
  stroke-width: 1;
}
@keyframes ml-move {
  to {
    transform: translateX(96px);
  }
}
@keyframes ml-jaw {
  from {
    transform: rotate(45.6deg);
  }
  to {
    transform: rotate(-134.4deg);
  }
}
@keyframes ml-spin {
  to {
    transform: rotate(720deg);
  }
}
@keyframes ml-unwind {
  to {
    transform: rotate(-240deg);
  }
}
@keyframes ml-seal {
  0% {
    opacity: 0.95;
  }
  22%,
  100% {
    opacity: 0;
  }
}
